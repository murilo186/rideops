<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="title description">
  <title id="title">Arquitetura do pipeline RideOps</title>
  <desc id="description">Dados sintéticos percorrem Python, CSV, PostgreSQL, views SQL, Jev AI, Google Sheets e Looker Studio.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8b949e"/>
    </marker>
    <style>
      .node { stroke-width: 2; rx: 16; }
      .label { font-family: Arial, sans-serif; font-size: 24px; font-weight: 700; fill: #f0f6fc; text-anchor: middle; }
      .sub { font-family: Arial, sans-serif; font-size: 17px; fill: #c9d1d9; text-anchor: middle; }
      .arrow { stroke: #8b949e; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .caption { font-family: Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #8b949e; text-anchor: middle; letter-spacing: 1px; }
    </style>
  </defs>
  <rect width="1600" height="560" fill="#0d1117" rx="20"/>
  <text x="800" y="55" class="caption">PIPELINE DE DADOS E DECISÃO OPERACIONAL</text>

  <rect x="60" y="140" width="190" height="105" class="node" fill="#1f6feb" stroke="#58a6ff"/>
  <text x="155" y="182" class="label">Python</text>
  <text x="155" y="212" class="sub">Gerador</text>
  <path d="M250 193 H310" class="arrow"/>

  <rect x="320" y="140" width="180" height="105" class="node" fill="#30363d" stroke="#8b949e"/>
  <text x="410" y="182" class="label">CSV</text>
  <text x="410" y="212" class="sub">Bruto e tratado</text>
  <path d="M500 193 H560" class="arrow"/>

  <rect x="570" y="140" width="205" height="105" class="node" fill="#5a3e85" stroke="#a371f7"/>
  <text x="672" y="182" class="label">Pandas</text>
  <text x="672" y="212" class="sub">Transformação</text>
  <path d="M775 193 H835" class="arrow"/>

  <rect x="845" y="140" width="210" height="105" class="node" fill="#1f5f99" stroke="#58a6ff"/>
  <text x="950" y="182" class="label">PostgreSQL</text>
  <text x="950" y="212" class="sub">Carga em massa</text>
  <path d="M1055 193 H1115" class="arrow"/>

  <rect x="1125" y="140" width="175" height="105" class="node" fill="#2d6a4f" stroke="#56d364"/>
  <text x="1212" y="182" class="label">Views SQL</text>
  <text x="1212" y="212" class="sub">Métricas</text>

  <path d="M1212 245 V315 H1025" class="arrow"/>
  <rect x="760" y="315" width="255" height="105" class="node" fill="#553c9a" stroke="#a371f7"/>
  <text x="887" y="357" class="label">Jev AI</text>
  <text x="887" y="387" class="sub">Risco operacional</text>

  <path d="M1212 245 V285 H1232 V315" class="arrow"/>
  <path d="M1015 367 H1120" class="arrow"/>
  <rect x="1130" y="315" width="205" height="105" class="node" fill="#1f6feb" stroke="#58a6ff"/>
  <text x="1232" y="357" class="label">Sheets</text>
  <text x="1232" y="387" class="sub">Dados e decisão</text>
  <path d="M1335 367 H1400" class="arrow"/>

  <rect x="1410" y="315" width="145" height="105" class="node" fill="#c27c0e" stroke="#e3b341"/>
  <text x="1482" y="357" class="label">Looker</text>
  <text x="1482" y="387" class="sub">Dashboard</text>

  <text x="1370" y="505" class="sub">Sincronização via Google Sheets API</text>
</svg>
